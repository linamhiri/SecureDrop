<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>SecureDrop - Upload</title>
</head>

<body>

<h1>SecureDrop</h1>

<nav>
    <a th:href="@{/files}">Files</a>
    |
    <a th:href="@{/files/upload}">Upload</a>
</nav>

<hr>

<h2>Upload a file</h2>

<div th:if="${errorMessage}">
    <p th:text="${errorMessage}"></p>
</div>

<form th:action="@{/files/upload}"
      method="post"
      enctype="multipart/form-data">

    <div>
        <label for="file">
            Select file
        </label>

        <input
                id="file"
                type="file"
                name="file"
                required>
    </div>

    <br>

    <button type="submit">
        Upload
    </button>

</form>

<p>
    Maximum file size: 25 MB
</p>

</body>
</html>

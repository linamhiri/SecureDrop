<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureDrop - Files</title>

    <link rel="stylesheet"
          th:href="@{/css/securedrop.css}">
</head>

<body>

<header class="app-header">

    <div class="header-inner">

        <a class="brand"
           th:href="@{/files}">

            <span class="brand-mark">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <path d="M12 3l7 4v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V7l7-4z"/>

                </svg>

            </span>

            SecureDrop
        </a>

        <nav class="main-nav">

            <a class="nav-link active"
               th:href="@{/files}">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <path d="M3 6h6l2 2h10v10H3z"/>

                </svg>

                Files
            </a>

            <a class="nav-link"
               th:href="@{/files/upload}">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <path d="M12 16V4"/>
                    <path d="M8 8l4-4 4 4"/>
                    <path d="M4 14v5h16v-5"/>

                </svg>

                Upload
            </a>

        </nav>

    </div>

</header>


<main class="page-container">

    <div class="page-heading">

        <div>
            <h1>Uploaded files</h1>

            <p>
                Review uploaded files and their security scan status.
            </p>
        </div>

        <a class="button button-primary"
           th:href="@{/files/upload}">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <path d="M12 5v14"/>
                <path d="M5 12h14"/>

            </svg>

            Upload file
        </a>

    </div>


    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

    <div th:if="${errorMessage}"
         class="alert alert-error"
         th:text="${errorMessage}">
    </div>


    <div th:if="${#lists.isEmpty(files)}"
         class="card empty-state">

        <div class="empty-icon">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <path d="M3 6h6l2 2h10v10H3z"/>

            </svg>

        </div>

        <h2>No files uploaded yet</h2>

        <p>
            Upload a file to start the secure scanning process.
        </p>

        <a class="button button-primary"
           th:href="@{/files/upload}">
            Upload your first file
        </a>

    </div>


    <div th:unless="${#lists.isEmpty(files)}"
         class="card table-card">

        <div class="table-wrapper">

            <table class="files-table">

                <thead>

                <tr>
                    <th>File</th>
                    <th>Size</th>
                    <th>Status</th>
                    <th>Uploaded</th>
                    <th>Details</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="file : ${files}">

                    <td class="file-name"
                        th:text="${file.originalFilename}">
                        example.pdf
                    </td>

                    <td class="file-size"
                        th:text="${file.size + ' bytes'}">
                        100 bytes
                    </td>

                    <td>

                        <span class="status"
                              th:classappend="${
                                file.status.name() == 'CLEAN' ? ' status-clean' :
                                file.status.name() == 'INFECTED' ? ' status-infected' :
                                file.status.name() == 'SCANNING' ? ' status-scanning' :
                                file.status.name() == 'ERROR' ? ' status-error' :
                                file.status.name() == 'UPLOADED' ? ' status-uploaded' :
                                ' status-pending'
                              }"
                              th:text="${file.status}">
                            PENDING_SCAN
                        </span>

                    </td>

                    <td class="file-date"
                        th:text="${file.uploadedAt}">
                        date
                    </td>

                    <td>

                        <a class="button button-outline"
                           th:href="@{/files/{id}(id=${file.id})}">

                            <svg viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="2">

                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/>
                                <circle cx="12"
                                        cy="12"
                                        r="2.5"/>

                            </svg>

                            View
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</main>

</body>
</html>

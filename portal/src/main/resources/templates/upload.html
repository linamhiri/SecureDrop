<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureDrop - Upload</title>

    <link rel="stylesheet"
          th:href="@{/css/securedrop.css}">
</head>

<body>

<header class="app-header">

    <div class="header-inner">

        <a class="brand"
           th:href="@{/files}">

            <span class="brand-mark">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <path d="M12 3l7 4v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V7l7-4z"/>

                </svg>

            </span>

            SecureDrop
        </a>

        <nav class="main-nav">

            <a class="nav-link"
               th:href="@{/files}">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <path d="M3 6h6l2 2h10v10H3z"/>

                </svg>

                Files
            </a>

            <a class="nav-link active"
               th:href="@{/files/upload}">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <path d="M12 16V4"/>
                    <path d="M8 8l4-4 4 4"/>
                    <path d="M4 14v5h16v-5"/>

                </svg>

                Upload
            </a>

        </nav>

    </div>

</header>


<main class="page-container">

    <div class="page-heading">

        <div>
            <h1>Upload a file</h1>

            <p>
                Files are placed in quarantine and scanned before being approved.
            </p>
        </div>

    </div>


    <div th:if="${errorMessage}"
         class="alert alert-error"
         th:text="${errorMessage}">
    </div>


    <div class="card upload-card">

        <form th:action="@{/files/upload}"
              method="post"
              enctype="multipart/form-data">

            <div class="upload-area">

                <div class="upload-icon">

                    <svg viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2">

                        <path d="M12 16V4"/>
                        <path d="M8 8l4-4 4 4"/>
                        <path d="M4 14v5h16v-5"/>

                    </svg>

                </div>

                <label for="file">
                    Select a file to upload
                </label>

                <p>
                    The file will automatically enter the security scanning pipeline.
                </p>

                <input id="file"
                       type="file"
                       name="file"
                       required>

            </div>

            <button class="button button-primary"
                    type="submit">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2">

                    <path d="M12 16V4"/>
                    <path d="M8 8l4-4 4 4"/>
                    <path d="M4 14v5h16v-5"/>

                </svg>

                Upload file
            </button>

        </form>


        <div class="upload-note">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <circle cx="12"
                        cy="12"
                        r="9"/>

                <path d="M12 11v5"/>
                <path d="M12 8h.01"/>

            </svg>

            Maximum file size: 25 MB

        </div>

    </div>

</main>

</body>
</html>

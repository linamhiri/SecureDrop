services:

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: securedrop-azurite

    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --skipApiVersionCheck
      --location /data

    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

    volumes:
      - azurite-data:/data

    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5
    container_name: securedrop-clamav

    ports:
      - "127.0.0.1:3310:3310"

    volumes:
      - clamav-data:/var/lib/clamav

    restart: unless-stopped

volumes:
  azurite-data:
  clamav-data:
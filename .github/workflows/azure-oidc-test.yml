name: Azure OIDC Test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/scanner-azure-auth
    paths:
      - ".github/workflows/azure-oidc-test.yml"

permissions:
  id-token: write
  contents: read

jobs:
  test-azure-login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity
        run: |
          az account show --query "{Subscription:name,Tenant:tenantId}" -o table
          az acr show \
            --name securedropacr2026 \
            --resource-group securedrop-rg \
            --query "{Registry:name,LoginServer:loginServer}" \
            -o table